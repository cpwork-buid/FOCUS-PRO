name: FOCUS PRO Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Gradle 8.7 & Build Debug APK
        run: |
          set -e
          echo "=== 1. Downloading Standalone Gradle 8.7 ==="
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp

          echo "=== 2. Unpacking Project ZIP if uploaded directly ==="
          if [ ! -f "settings.gradle.kts" ] && [ -f "FOCUS_PRO_Android_Project.zip" ]; then
            echo "Found FOCUS_PRO_Android_Project.zip in repo root, extracting..."
            unzip -q -o FOCUS_PRO_Android_Project.zip -d .
          fi

          echo "=== 3. Running Unit Tests & Assembling Debug APK ==="
          mkdir -p build-logs
          /tmp/gradle-8.7/bin/gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee build-logs/gradle-build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS_PRO-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            build-logs/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
